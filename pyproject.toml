[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinka-evolve"
dynamic = ["version"]
description = "Automated Scientific Evolution"
authors = [
    {name = "Sakana AI", email = "robert@sakana.ai"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
urls = {Homepage = "https://sakana.ai/shinka-evolve/", Documentation = "https://sakanaai.github.io/ShinkaEvolve/", Repository = "https://github.com/SakanaAI/ShinkaEvolve", Issues = "https://github.com/SakanaAI/ShinkaEvolve/issues"}
dependencies = [
    "openai>=3.0",
    "numpy",
    "pandas",
    "anthropic>=1.5.0",
    "requests",
    "boto3",
    "pydantic",
    "backoff",
    "python-dotenv",
    "instructor",
    "python-Levenshtein",
    "radon",
    "unidiff",
    "dill",
    "hydra-core==1.3.7",
    "matplotlib",
    "networkx",
    "seaborn",
    "moviepy",
    "scikit-learn",
    "adjustText",
    "markdown",
    "aiofiles",
    "google-genai>=2.23.0,<3",
    "psutil",
    "httpx>=0.28.1"
]

[project.optional-dependencies]
wandb = ["wandb>=0.30.0"]

[project.scripts]
shinka_launch = "shinka.cli.launch:main"
shinka_models = "shinka.cli.models:main"
shinka_run = "shinka.cli.run:main"
shinka_visualize = "shinka.webui.visualization:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "shinka.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["shinka*"]

[tool.setuptools.package-data]
shinka = [
    "configs/*.yaml",
    "configs/*/*.yaml",
    "favicon.png",
    "tools/pricing/*.json",
    "embed/providers/*.csv",
    "llm/providers/*.csv",
    "webui/*.html",
    "webui/*.png",
    "webui/*.jpg",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff==0.16.7",
    "mypy",
    "black",
    "isort",
    "flake8",
    "pytest-asyncio>=1.4.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=12.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: live external/provider integration coverage",
    "models_dev_live: live models.dev catalog contract coverage",
    "requires_secrets: tests that need CI secrets or private credentials",
]

[tool.ruff.lint]
# Preserve the project's enforced rules across Ruff's 0.16 default expansion.
select = ["E4", "E7", "E9", "F"]
