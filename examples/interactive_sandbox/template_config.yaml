name: interactive_sandbox
description: >
  Minimal sandbox for testing interactive evolution with a mock LLM.
  No API keys required — the LLM is monkey-patched to return trivially
  modified programs, and the evaluator assigns a random score.
language: python
task_sys_msg: >
  You are evolving a simple Python function that returns a number.
  The goal is to maximise the returned value.
  Be creative — change constants, restructure the logic, try new ideas.

defaults:
  patch_types: [full]
  patch_type_probs: [1.0]
  num_generations: 20
  max_parallel_jobs: 1
  num_islands: 1
  archive_size: 10
  parent_selection_strategy: power_law
  llm_models: [mock-llm]
  embedding_model: null
